version: 2

sources:
  - name: payroll
    description: "Raw SF Employee Compensation data, loaded by COPY INTO. All columns are text, unchanged from the source file."
    database: "RAW_{{ target.name | upper }}"
    schema: PAYROLL
    config:
      loaded_at_field: _etl_loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: employee_compensation
        description: "One row per employee appointment per year (Fiscal and Calendar). No employee ID."